# Provenance for every image used by an example.
#
# The images themselves are NOT committed -- this repository is MIT and cannot
# redistribute third-party imagery whose terms it does not control. What is
# committed is this file: where each image came from, under what licence, and a
# checksum so a fetched copy can be shown to be the one described here.
#
# Add the entry before adding the file. `sha256` is of the bytes as served.
#
# Fields, all required:
#   file         name under examples/images/
#   description  what it shows, and why it is useful here
#   source_url   the exact URL the bytes come from
#   page_url     the human-readable page that states the terms
#   licence      SPDX identifier where one exists, else the terms' own name
#   attribution  the credit line the licence requires, verbatim
#   redistribute true only if the licence permits us to ship the file itself
#   retrieved    ISO date the URL was last confirmed
#   sha256       checksum of the file as served
#
# For a georeferenced source (satellite or aerial imagery used to read off
# control-point coordinates) also record:
#   crs          coordinate reference system, e.g. EPSG:4326
#   resolution_m ground sample distance of that product, in metres
#
# Anything marked `redistribute: false` must stay out of git. `.gitignore`
# excludes this directory's contents apart from this file, so that is the
# default and forgetting is safe.

images: []

# Verified licence terms for sources of ground-truth coordinates. An entry here
# is a provider whose terms have been read first-hand, not a file. Adding an
# image from one of these still needs its own `images:` entry with a checksum.
ground_truth_sources:
  - name: Copernicus Sentinel-2
    page_url: https://sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice
    licence: Copernicus Sentinel Data Legal Notice (EU law)
    legal_basis: Regulation (EU) No 377/2014; Commission Delegated Regulation (EU) No 1159/2013
    verified: 2026-09-14
    resolution_m: 10
    crs: EPSG:32630   # UTM zone varies with the scene
    redistribute: true
    commercial_use: true
    attribution: "Copernicus Sentinel data [Year]"
    attribution_if_modified: "Contains modified Copernicus Sentinel data [Year]"
    # Art. 7 of Regulation 1159/2013 grants, in so far as lawful: reproduction,
    # distribution, communication to the public, adaptation/modification and
    # combination with other data, and any combination of those. Art. 8 sets the
    # credit wording above. Arts. 3 and 9 disclaim all warranty, including
    # suitability for purpose -- which for this library means the coordinates you
    # read off it carry no accuracy guarantee whatsoever.
    #
    # CAVEAT, and it is the important one: 10 m per pixel. A control point picked
    # off Sentinel-2 is good to perhaps half a pixel, so +/- 5 m -- which on a
    # 200 m coastal scene would be the largest term in the whole error budget,
    # swamping everything docs/LIMITATIONS.md prices. Fine for demonstrating the
    # workflow; not a survey. For real control points use sub-metre national
    # aerial imagery and check that country's licence separately.

# Still to verify (WebSearch budget was exhausted before these were reached):
#   - sub-metre open aerial imagery per country: USGS NAIP (US, ~0.6 m; usgs.gov
#     blocks automated fetches, so read the terms by hand), and whatever the
#     national equivalent is elsewhere.
#   - a fixed-camera image with published intrinsics under a licence that permits
#     redistribution. Expect non-commercial terms to dominate here; if none is
#     found, the honest answer is that the user supplies their own image and this
#     manifest records only what they fetched.

# No real imagery is wired up yet; every example synthesises its pixels, which is
# why they run anywhere with no downloads. The two halves a real example needs
# are separable and have very different licence profiles:
#
#   1. A fixed camera's image. Intrinsics are a bonus, not a requirement --
#      fit_homography needs none. Most computer-vision datasets that publish
#      calibration are non-commercial, so check before adding one.
#   2. Georeferenced imagery to read control-point coordinates from. Public
#      domain and open options exist here; commercial basemap tiles (Google,
#      Bing, Esri) generally forbid this use, so do not reach for them.
#
# See examples/README.md, "Using a real image".
